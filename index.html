<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .headcontainer {
            display: flex;
            justify-content: flex-start; /* 양 끝으로 정렬 */
            align-items: center;
        }
        .container{
            display: flex;
            /*flex-direction: row;*/
            /* flex-direction: column;*/
	        /*flex-direction: row-reverse;*/ 
	        /* flex-direction: column-reverse; */
           /* flex-wrap: nowrap;*/
            justify-content: flex-end; 
        }
        .item{
            /*flex-basis: 100px;*/
            /*width: 100px;*/
            margin:50px 0px 20px 20px;
            padding:2px;
            font-size: 13px;
        }
        
       .container1{
            display: flex;
            margin-left: 200px;
       } 
       .item2{
         padding:2px;
         font-size :30px;
       }

       #red{
        color: red;
       }

       #black{
        color:black;
       }

       #darkcyan{
        color:darkcyan;
       }

       .container2{
            display:flex;
            margin-left:700px;
       }
       .item3{
            padding:20px;
            font-size :30px;
       }
       hr{
          border: none;               /* 기본 회색 테두리 제거 */
          border-top: 1px solid red;
       }
       .content-wrapper {
              display: flex;
              flex-direction: row;
              margin-left: 200px;
              gap: 20px; /* 사진과 사이드 메뉴 사이의 간격 */
              margin-top: 50px;
         }

        .vertical {
              display: flex;
              flex-direction: column;  /* 세로(수직) 방향으로 요소 배치 */
              height: 300px;
              gap: 10px; 
            }
        .vertical2{
            display: flex;
            flex-direction: column;
            align-items: center;    /* 가로 기준 중앙 정렬 */
            text-align: center;     /* 글자 텍스트 중앙 정렬 */

        }
       #item_box1{
         background-color: red;
         width: 200px;
         height: 100px;
         color: white;

     /* 오른쪽 아래 정렬을 위해 추가된 속성 */
         display: flex;
         justify-content: flex-end; /* 가로 우측 정렬 */
         align-items: flex-end;     /* 세로 하단 정렬 */
         padding: 15px;             /* 테두리와 글자 사이의 여백 */
         box-sizing: border-box;   
       }

       #item_box2{
        background-color: black;
        width:200px;
        height:100px;
        color: white;
        display:flex;
        justify-content: flex-end;
        align-items:flex-end;
        padding: 15px;
        box-sizing: border-box;
       }

       #item_box3{
        background-color: darkcyan;
        width:200px;
        height:100px;
        color: white;
        display:flex;
        justify-content:flex-end;
        align-items:flex-end;
        padding:15px;
        box-sizing: border-box;
       }
       
       .content-wrapper2{
            display: flex;
            flex-direction: row;
            margin-left: 200px;
            margin-top: 50px;
            gap: 30px;
        }
        .vertical2 img {
            width: 150px;           /* 원하는 크기로 이미지 축소 */
            height: auto;           /* 원본 비율 유지 */
            margin-bottom: 10px;    /* 이미지와 글자 사이 간격 */
        }


    </style>
</head>
<body>
    <div class = "container">
        <div class = "item">로그인</div>
        <div class = "item">인증센터</div>
        <div class = "item">은행소개</div>
        <div class = "item">Global</div>
    </div>

    <div class = "headcontainer">
        <div class = "container1">
        <div id = "red" class = "item2">BNK</div>
        <div class = "item2">부산은행</div>
        </div>
        <div class = "container2">
        <div class = "item3">개인뱅킹</div>
        <div class = "item3">기업뱅킹</div>
        <div class = "item3">금융상품</div>
        <div class = "item3">검색하기</div>
        <div class = "item3">전체메뉴</div>
        </div>
    </div>
    <hr>

    <div class = "content-wrapper">
            <img src = "images/tiger.jpg" width = 1000px height = 300px >
            <div class ="vertical">
            <div id = "item_box1">빠른조회서비스</div>
            <div id = "item_box2">사고분실신고</div>
            <div id = "item_box3">금융서비스보호</div>
            </div>
    </div>

   <div class = "content-wrapper2">
        <div class = "vertical2">
          <div class="content-wrapper2">
        <div class="vertical2">
            <!-- width, height 지우기 -->
            <img src="images/image1.png">
            <div style="font-weight: bold;">베스트상품</div>
            <div>온라인판매TOP5</div>
        </div>
        <div class="vertical2">
            <!-- width, height 지우기 -->
            <img src="images/image2.jpg">
            <div style="font-weight: bold;">목적별상품</div>
            <div>상황에 맞는 자금 관리</div>
        </div>
   </div>


</body>
</html>
