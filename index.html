<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK4-EBook</title>
    <style>
    * {
        box-sizing: border-box;
    }
    body {
        background-color: #FDFBF7;
        margin: 0;
        padding: 0;
        /*border: 1px solid red;  */
    }

    /* 2. 전체를 감싸는 중심 틀 */
    .container {
        width: 1500px;
        margin: 0 auto;
        /*border: 1px solid red;*/  
    }

    /* [수정] 자식 요소들을 세로 정렬 기준 중앙(center)으로 맞추고 여백을 일괄 조정 */
    .header {
        display: flex;
        align-items: center; 
        justify-content: space-between;
        padding: 40px 0; /* 상하 여백으로 헤더 높이 확보 */
        /*border: 1px solid red;*/
    }

    /* [추가] 로고와 검색창을 나란히 묶어주는 정렬 상자 */
    .logo_search_box {
        display: flex;
        align-items: center;
        gap: 30px; /* 로고와 검색창 사이의 간격 */
        /*border: 1px solid red;*/
    }

    /* [수정] 불필요한 과도한 마진을 지우고 깔끔하게 배치 */
    #logo {
        color: red;
        padding: 0;
        margin: 0; 
        font-size: 32px; 
        /*border: 1px solid red;*/  
    }

    /* [수정] 마진을 제거하여 우측 상단 메뉴도 세로 중앙에 오도록 일치시킴 */
    #top_menu {
        display: flex;
        gap: 20px;
        font-weight: bold;
        list-style: none;
        margin: 0; 
        padding: 0;
        /*border: 1px solid red;*/
    }

    /* 4. 메인 타이틀 영역 */
    .main_content {
        text-align: center; 
        margin-top: 100px;   /* 상단 헤더와의 간격 조절 */
        /*border: 1px solid red;*/  
    }

    #main_title {
        margin: 0;
        margin-bottom: 40px; /* 베스트셀러 타이틀과 책 목록 사이의 간격 */
        font-size: 68px;
        /*border: 1px solid red;*/  
    }
    .book_list {
        display: flex;
        gap: 25px;
        justify-content: center; /* 책 이미지들을 화면 가운데로 배치 */
    }
    .book_list img {
         width: 280px;
    } 
     .view_more_btn {
        display: inline-block;   /* [추가] a 태그에 마진, 크기를 적용하기 위해 필수 */
        text-decoration: none;   /* [추가] 링크 밑줄 제거 */
        margin-top: -30px;
        margin-bottom: 20px;
        background-color: #fff;
        color: #333;
        border: 1px solid #333;   /* 버튼 구분을 위한 임시 테두리 */
        padding: 15px 30px;      /* 위아래 15px, 좌우 30px로 패딩 비율 조정 */
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;         
        border-radius: 20px;     
        transition: all 0.2s;    
    }
    #top_menu2{
        display:flex;
        list-style: none;
        gap:20px;
    }
    </style>
</head>

<body>
    <div class="container">
        <!-- 상단 영역 -->
         <header class="header">
            <!-- [변경] 로고와 검색창을 하나의 상자(.logo_search_box)로 감싸서 나란히 정렬합니다 -->
            <div class="logo_search_box">
                <h1 id="logo">BNK4-EBook</h1>
                <ul id = "top_menu2">
                    <li>특가</li>
                    <li>기프트카트</li>
                    <li>혜택 이벤트</li>
                </ul>
            </div>
            
            <ul id="top_menu">
                <li>로그인</li>
                <li>회원가입</li>
                <li>고객센터</li>
                <li>장바구니</li>
            </ul>
        </header>
        <!-- 본문 타이틀 영역 -->
        <main class="main_content">
            <h2 id="main_title">이달의 베스트 셀러!!</h2>
            <a href="Book_index2.html" class="view_more_btn">자세히보기 &gt;</a>
            <div class="book_list">
                <img src="book1.jpg" alt="book1">
                <img src="book2.jpg" alt="book2">
                <img src="book3.jpg" alt="book3">
                <img src="book4.jpg" alt="book4">
                <img src="book5.jpg" alt="book5">
            </div>
        </main>
    </div>
</body>
</html>
